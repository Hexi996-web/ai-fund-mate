name: Validate application quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-data.txt
      - name: Install dependencies
        run: |
          npm ci
          pip install -r requirements-data.txt
          npx playwright install --with-deps chromium
      - name: Validate JavaScript and production build
        run: |
          npm test
          npm run build
      - name: Validate data and database code
        run: python -m pytest -q
      - name: Validate user flows
        run: npm run test:e2e
