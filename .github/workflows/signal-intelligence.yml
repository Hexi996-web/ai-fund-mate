name: Signal intelligence

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: signal-intelligence-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/signal-intelligence-setup.md

      - name: Install pipeline dependencies
        run: python -m pip install "psycopg[binary]>=3.2,<4" "requests>=2.32,<3"

      - name: Collect, generate the scheduled brief, and publish snapshot
        run: python scripts/run_signal_schedule.py

      - name: Deploy generated snapshot
        run: npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
