name: Signal intelligence

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: signal-intelligence-production
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/signal-intelligence-setup.md

      - name: Install pipeline dependencies
        run: python -m pip install "psycopg[binary]>=3.2,<4" "requests>=2.32,<3" "beautifulsoup4>=4.13,<5" "jsonschema>=4.23,<5"

      - name: Collect, generate the scheduled brief, and publish snapshot
        run: python scripts/run_signal_schedule.py

      - name: Validate and publish generated snapshot
        run: |
          python scripts/validate_published_freshness.py public/data/signal-radar.json --field generatedAt --max-age-hours 2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/signal-radar.json
          git diff --cached --quiet || git commit -m "data: update signal intelligence"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push && break
            test "$attempt" -eq 3 && exit 1
            sleep $((attempt * 5))
          done
