name: Update five-theme data
on:
  schedule:
    - cron: "30 11 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch:
concurrency:
  group: five-theme-data
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-data.txt
      - run: pip install -r requirements-data.txt
      - run: python scripts/run_five_theme_pipeline.py catalog-check
      - name: Collect and publish one coherent daily snapshot
        run: |
          python scripts/collect_verified_sources.py
          python scripts/collect_second_batch.py
          python scripts/collect_third_batch.py
          python scripts/finalize_theme_quality.py
          python scripts/complete_theme_coverage.py
          python scripts/generate_five_evidence_scores.py
          python scripts/snapshot_and_generate_scenarios.py
          python scripts/validate_published_freshness.py public/data/five-themes/scores.json --field generatedAt --max-age-hours 30
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-theme-quality
          path: public/data/five-themes/quality.json
      - name: Commit published snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/five-themes
          git diff --cached --quiet || git commit -m "data: update five-theme snapshots"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push && break
            test "$attempt" -eq 3 && exit 1
            sleep $((attempt * 5))
          done
