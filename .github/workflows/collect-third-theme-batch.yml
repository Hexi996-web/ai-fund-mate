name: Collect third theme batch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-data.txt
      - run: pip install -r requirements-data.txt
      - run: python -m pytest tests/data_pipeline -q
      - run: python scripts/collect_third_batch.py
      - run: python scripts/finalize_theme_quality.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: third-theme-quality
          path: public/data/five-themes/quality.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/five-themes/observations.json public/data/five-themes/documents.json public/data/five-themes/quality.json
          git diff --cached --quiet || git commit -m "data: collect policy and cross-border evidence"
          git push
