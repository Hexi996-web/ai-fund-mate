name: Update active fund data

on:
  schedule:
    # 北京时间每天 06:00 主更新，为 08:00 页面可见预留部署时间
    - cron: "0 22 * * *"
    # 北京时间每天 07:00 自动补跑
    - cron: "0 23 * * *"
  workflow_dispatch:

concurrency:
  group: active-fund-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-data.txt
      - name: Install data dependencies
        run: pip install -r requirements-data.txt
      - name: Build active fund dataset
        run: |
          python scripts/update_active_funds.py
          python scripts/update_issuance_insights.py
      - name: Validate fund datasets
        run: |
          python -m pytest scripts/test_fund_product_model.py scripts/test_update_active_funds.py -q
          python -m pytest scripts/test_update_issuance_insights.py -q
          python -m pytest scripts/test_validate_published_freshness.py -q
          python scripts/validate_published_freshness.py public/funds_active.json --field updateTime --max-age-hours 30
          python scripts/validate_published_freshness.py public/issuance_insights.json --field generatedAt --max-age-hours 30
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/funds_active.json public/funds_excluded.json public/fund_products.json public/funds_grouping_review.json public/issuance_insights.json
          git diff --cached --quiet || git commit -m "data: update active funds"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push && break
            test "$attempt" -eq 3 && exit 1
            sleep $((attempt * 5))
          done
