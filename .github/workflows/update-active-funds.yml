name: Update active fund data

on:
  schedule:
    # 北京时间每天 19:00（UTC 11:00）
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-data.txt
      - name: Install data dependencies
        run: pip install -r requirements-data.txt
      - name: Build active fund dataset
        run: python scripts/update_active_funds.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/funds_active.json public/funds_excluded.json
          git diff --cached --quiet || git commit -m "data: update active funds"
          git push
