name: Update active fund data

on:
  schedule:
    # GitHub Actions 的整点队列容易延迟，因此使用非整点并预留三次机会。
    # 北京时间每天 04:43 安全预跑，为数据源或队列延迟预留余量。
    - cron: "43 20 * * *"
    # 北京时间每天 05:53 主更新。
    - cron: "53 21 * * *"
    # 北京时间每天 07:03 最终补跑，给部署与线上验收预留完整窗口。
    - cron: "3 23 * * *"
  workflow_dispatch:
    inputs:
      verify_only:
        description: "只检查已发布快照和三个线上板块，不重新抓取基金数据"
        required: false
        default: false
        type: boolean

concurrency:
  # Serialize every workflow that writes files under public/.  In particular,
  # the daily full refresh must not race the two-hour attention sampler.
  group: public-data-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Sync latest main before generating data
        run: git pull --rebase origin "$GITHUB_REF_NAME"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-data.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install data dependencies
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.verify_only != true }}
        run: pip install -r requirements-data.txt
      - name: Restore accumulated history from PostgreSQL
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.verify_only != true }}
        env:
          DATABASE_URL: ${{ secrets.HISTORY_DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -n "$DATABASE_URL" ] || [ -n "$SUPABASE_DB_URL" ]; then
            python -m scripts.history.apply_migrations
            python -m scripts.history.hydrate_public_history
          fi
      - name: Build active fund dataset
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.verify_only != true }}
        run: |
          python scripts/update_active_funds.py
          python scripts/backfill_2026_fund_metrics.py --missing-baseline-only --workers 24 --min-coverage 0.50
          python scripts/update_issuance_insights.py || echo "::warning::发行接口本次不可用，保留上一版快照并交由新鲜度校验"
          python scripts/update_attention_pool.py
          python scripts/update_industry_demand_sources.py
          python scripts/update_three_layer_evidence.py
          python scripts/rescore_research_opportunities.py
          node scripts/update_horizon_rankings.mjs
          python scripts/publish_data_status.py
          node scripts/build_market_forecast_snapshot.mjs
          node scripts/build_agent_context.mjs
      - name: Read expected snapshot date
        id: snapshot
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          products = json.load(open('public/fund_products.json', encoding='utf-8'))
          issuance = json.load(open('public/issuance_insights.json', encoding='utf-8'))
          print(f"date={products['dataDate']}")
          print(f"update_time={products['updateTime']}")
          print(f"issuance_date={issuance['dataDate']}")
          PY
      - name: Validate fund datasets
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.verify_only != true }}
        run: |
          python -m pytest scripts/test_fund_product_model.py scripts/test_update_active_funds.py -q
          python -m pytest scripts/test_update_attention_pool.py -q
          python -m pytest scripts/test_three_layer_evidence.py -q
          python -m pytest scripts/test_rescore_research_opportunities.py -q
          python -m pytest scripts/test_update_industry_demand_sources.py -q
          python -m pytest scripts/test_update_issuance_insights.py -q
          python -m pytest scripts/test_validate_published_freshness.py -q
          python -m pytest scripts/test_agent_context_workflows.py -q
          python -m pytest scripts/test_verify_deployed_snapshot.py -q
          python scripts/validate_published_freshness.py public/funds_active.json --field updateTime --max-age-hours 12 --min-items funds=1000
          python scripts/validate_published_freshness.py public/fund_products.json --field updateTime --max-age-hours 12 --min-items products=1000
          python scripts/validate_published_freshness.py public/issuance_insights.json --field generatedAt --max-age-hours 12
          python scripts/validate_published_freshness.py public/attention_pool_evidence.json --field generatedAt --max-age-hours 12 --min-items items=36
          python scripts/validate_published_freshness.py public/theme_external_signals.json --field generatedAt --max-age-hours 192 --min-items items=36
          python -c "import json; d=json.load(open('public/attention_pool_evidence.json',encoding='utf-8')); assert d['verifiedCount']==36 and len(d['recommendedIds'])==10, d"
          python -c "import json; d=json.load(open('public/attention_pool_evidence.json',encoding='utf-8')); expected={'industryDemand':.2,'productMarket':.2,'enterpriseDelivery':.1,'attentionCognition':.25,'assetCapacity':.2,'riskResilience':.05}; assert d.get('opportunityModelVersion')=='opportunity-demand-attention-v2'; assert len(d.get('items',[]))==36 and all(x.get('opportunityModel',{}).get('rankingWeights')==expected for x in d['items'])"
          python -c "import json; d=json.load(open('public/pre_research_evidence.json',encoding='utf-8')); assert d['coveredCount']==36 and d['enterpriseDataCount']==36 and d['assetDataCount']==36, {k:d.get(k) for k in ('coveredCount','enterpriseDataCount','assetDataCount','assetMarketHistoryCount')}"
          python scripts/validate_published_freshness.py public/data_status.json --field generatedAt --max-age-hours 12
          python scripts/validate_published_freshness.py public/agent_context.json --field generatedAt --max-age-hours 12
      - name: Verify frontend build against the generated snapshots
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.verify_only != true }}
        run: |
          npm ci
          npm run build
      - name: Store daily fund scale history
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.verify_only != true }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/store_fund_scale_snapshots.py
      - name: Migrate and accumulate normalized history platform data
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.verify_only != true }}
        env:
          DATABASE_URL: ${{ secrets.HISTORY_DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ] && [ -z "$SUPABASE_DB_URL" ]; then
            echo "历史数据库未配置，保留现有 JSON 发布流程"
            exit 0
          fi
          python -m scripts.history.apply_migrations
          python -m scripts.history.import_daily_snapshots --source-dir public
          python -m scripts.history.compact_public_history
          python scripts/publish_data_status.py
          node scripts/build_market_forecast_snapshot.mjs
          node scripts/build_agent_context.mjs
      - name: Commit updated data
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.verify_only != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/funds_active.json public/funds_excluded.json public/fund_products.json public/funds_grouping_review.json public/issuance_insights.json public/attention_pool_evidence.json public/social_attention_history.json public/theme_external_signals.json public/industry_demand_sources.json public/pre_research_evidence.json public/data_status.json public/agent_context.json public/market_forecast.json
          git diff --cached --quiet || git commit -m "data: update active funds"
          for attempt in 1 2 3; do
            # During a rebase Git labels the replayed data commit as "theirs".
            # The full refresh is newer than partial samplers, so keep its
            # generated public snapshots if a same-file conflict occurs.
            if git pull --rebase -X theirs origin "$GITHUB_REF_NAME"; then
              python scripts/publish_data_status.py
              node scripts/build_market_forecast_snapshot.mjs
              node scripts/build_agent_context.mjs
              python -c "import json; p=json.load(open('public/fund_products.json',encoding='utf-8')); s=json.load(open('public/data_status.json',encoding='utf-8')); assert (s['dataDate'],s['productsUpdateTime'])==(p['dataDate'],p['updateTime'])"
              git add public/data_status.json public/agent_context.json public/market_forecast.json
              git commit --amend --no-edit
              git push && break
            fi
            git rebase --abort 2>/dev/null || true
            test "$attempt" -eq 3 && exit 1
            sleep $((attempt * 5))
          done
      - name: Install interface verifier dependencies
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only == true }}
        run: npm ci
      - name: Verify all three production interfaces
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only == true }}
        env:
          EXPECTED_DATE: ${{ steps.snapshot.outputs.date }}
          EXPECTED_UPDATE_TIME: ${{ steps.snapshot.outputs.update_time }}
        run: |
          npx playwright install --with-deps chromium
          node scripts/verify_deployed_interface.mjs
