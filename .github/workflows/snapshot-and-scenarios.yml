name: Snapshot and generate scenarios
on:
  schedule:
    - cron: "30 14 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-data.txt
      - run: python -m pytest tests/data_pipeline tests/scoring tests/forecasting -q
      - run: python scripts/snapshot_and_generate_scenarios.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/five-themes/history public/data/five-themes/scenarios.json public/data/five-themes/forecast-reviews.json
          git diff --cached --quiet || git commit -m "data: snapshot scores and update scenarios"
          git push
