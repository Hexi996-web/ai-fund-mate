name: Generate five-evidence scores
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-data.txt
      - run: python -m pytest tests/data_pipeline tests/scoring -q
      - run: python scripts/complete_theme_coverage.py
      - run: python scripts/generate_five_evidence_scores.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/five-themes/scores.json
          git diff --cached --quiet || git commit -m "data: generate five-evidence scores"
          git push
