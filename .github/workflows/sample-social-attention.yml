name: Sample social attention

on:
  schedule:
    # Every two hours, at a non-round minute to reduce queue contention.
    - cron: "23 */2 * * *"
  workflow_dispatch:

concurrency:
  group: social-attention-sampling
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # GDELT is sampled by the daily full-data workflow. The two-hour job only
      # records Chinese public hot lists and reuses the last media-agenda value.
      GDELT_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight dependencies
        run: pip install requests pytest
      - name: Sample Baidu and Toutiao public hot lists
        run: python scripts/update_attention_pool.py
      - name: Validate attention output
        run: |
          python -m pytest scripts/test_update_attention_pool.py -q
          python -c "import json; d=json.load(open('public/attention_pool_evidence.json',encoding='utf-8')); assert d['verifiedCount']==36 and len(d['recommendedIds'])==10 and d['methodologyVersion']=='cn-hotlists-gdelt-v1', d"
      - name: Commit rolling attention history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/attention_pool_evidence.json public/social_attention_history.json
          git diff --cached --quiet || git commit -m "data: sample social attention"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push && break
            test "$attempt" -eq 3 && exit 1
            sleep $((attempt * 5))
          done
