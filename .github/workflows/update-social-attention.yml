name: Update social attention history

on:
  schedule:
    # Every two hours at :23; the non-round minute reduces GitHub scheduler congestion.
    # Changed on 2026-08-27 to force GitHub to re-register a schedule that stopped dispatching.
    - cron: "23 */2 * * *"
  workflow_dispatch:

concurrency:
  # Every workflow that commits generated public data shares this lock.  This
  # prevents two scheduled jobs from rebasing different versions of the same
  # rolling history files at the same time.
  group: public-data-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-data.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install data dependencies
        run: pip install -r requirements-data.txt
      - name: Restore accumulated history from PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.HISTORY_DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -n "$DATABASE_URL" ] || [ -n "$SUPABASE_DB_URL" ]; then
            python -m scripts.history.apply_migrations
            python -m scripts.history.hydrate_public_history
          fi
      - name: Update attention observations
        env:
          GDELT_ENABLED: "0"
        run: |
          python scripts/update_attention_pool.py
          python scripts/rescore_research_opportunities.py
          node scripts/update_horizon_rankings.mjs
          python scripts/publish_data_status.py
          node scripts/build_agent_context.mjs
          python -m pytest scripts/test_update_attention_pool.py -q
          python -m pytest scripts/test_agent_context_workflows.py -q
          python scripts/validate_published_freshness.py public/attention_pool_evidence.json --field generatedAt --max-age-hours 4 --min-items items=36
          python -c "import json; d=json.load(open('public/attention_pool_evidence.json',encoding='utf-8')); expected={'industryDemand':.2,'productMarket':.2,'enterpriseDelivery':.1,'attentionCognition':.25,'assetCapacity':.2,'riskResilience':.05}; assert d.get('opportunityModelVersion')=='opportunity-demand-attention-v2'; assert len(d.get('items',[]))==36 and all(x.get('opportunityModel',{}).get('rankingWeights')==expected for x in d['items'])"
          python scripts/validate_published_freshness.py public/data_status.json --field generatedAt --max-age-hours 4
          python scripts/validate_published_freshness.py public/agent_context.json --field generatedAt --max-age-hours 4
      - name: Persist full history and compact the public fallback
        env:
          DATABASE_URL: ${{ secrets.HISTORY_DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -n "$DATABASE_URL" ] || [ -n "$SUPABASE_DB_URL" ]; then
            python -m scripts.history.import_daily_snapshots --source-dir public
            python -m scripts.history.compact_public_history
            python scripts/publish_data_status.py
            node scripts/build_agent_context.mjs
          fi
      - name: Commit attention history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/attention_pool_evidence.json public/social_attention_history.json public/data_status.json public/agent_context.json
          if git diff --cached --quiet; then
            echo "No attention changes to publish"
            exit 0
          fi
          git commit -m "data: sample social attention"
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin "$GITHUB_REF_NAME"; then
              # The manifest and agent context combine attention with fund data.
              # Rebuild them after rebase so they cannot retain an older fund timestamp.
              python scripts/publish_data_status.py
              node scripts/build_agent_context.mjs
              python -c "import json; p=json.load(open('public/fund_products.json',encoding='utf-8')); s=json.load(open('public/data_status.json',encoding='utf-8')); assert (s['dataDate'],s['productsUpdateTime'])==(p['dataDate'],p['updateTime'])"
              git add public/data_status.json public/agent_context.json
              git commit --amend --no-edit
              git push && exit 0
            fi
            git rebase --abort 2>/dev/null || true
            test "$attempt" -eq 3 && exit 1
            sleep $((attempt * 5))
          done
