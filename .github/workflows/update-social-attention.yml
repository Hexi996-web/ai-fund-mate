name: Update social attention history

on:
  schedule:
    # Every two hours at :17; raw samples retain 90 days, rollups accumulate.
    - cron: "17 */2 * * *"
  workflow_dispatch:

concurrency:
  group: social-attention-data
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-data.txt
      - name: Install data dependencies
        run: pip install -r requirements-data.txt
      - name: Update attention observations
        env:
          GDELT_ENABLED: "0"
        run: |
          python scripts/update_attention_pool.py
          python scripts/publish_data_status.py
          python -m pytest scripts/test_update_attention_pool.py -q
      - name: Commit attention history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/attention_pool_evidence.json public/social_attention_history.json public/data_status.json
          git diff --cached --quiet || git commit -m "data: sample social attention"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push && break
            test "$attempt" -eq 3 && exit 1
            sleep $((attempt * 5))
          done
