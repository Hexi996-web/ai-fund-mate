name: Collect verified theme sources
on:
  workflow_dispatch:
concurrency:
  group: verified-theme-sources
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-data.txt
      - run: pip install -r requirements-data.txt
      - run: python -m pytest tests/data_pipeline -q
      - run: python scripts/collect_verified_sources.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-theme-quality
          path: public/data/five-themes/quality.json
      - name: Commit verified observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/five-themes/observations.json public/data/five-themes/quality.json
          git diff --cached --quiet || git commit -m "data: collect verified theme observations"
          git push
